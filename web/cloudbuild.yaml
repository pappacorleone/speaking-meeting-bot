steps:
  - name: 'gcr.io/kaniko-project/executor:latest'
    args:
      - '--dockerfile=Dockerfile'
      - '--context=.'
      - '--build-arg=NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL}'
      - '--build-arg=NEXT_PUBLIC_WS_URL=${_NEXT_PUBLIC_WS_URL}'
      - '--build-arg=NEXT_PUBLIC_MEETING_BAAS_API_KEY=${_NEXT_PUBLIC_MEETING_BAAS_API_KEY}'
      - '--destination=${_IMAGE}'
      - '--cache=true'
